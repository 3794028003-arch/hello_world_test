services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: memo_db
      POSTGRES_USER: memo
      POSTGRES_PASSWORD: "123456"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memo -d memo_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
